name: Export published articles to AX vault

on:
  # Runs after "Update industry AX briefing" (see update.yml) finishes, so it
  # always reads that run's freshly-committed public/data.json.
  workflow_run:
    workflows: ["Update industry AX briefing"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  # Public vault (matrixshin-ai/ax-vault) - summary + link only, per
  # vars.EXPORT_MODE (defaults to "summary" - kept that way deliberately
  # while this vault is public; see export-full below for the private one).
  #
  # DISABLED 2026-10-10: matrixshin-ai/ax-vault is deprecated - switched to
  # private and archived (read-only), so its push step would fail every run.
  # ax-vault-full (export-full below) is the only vault kept going forward.
  # The job is kept rather than deleted for reference; `false &&` stops it
  # from running on both workflow_run and workflow_dispatch. Remove the
  # `false &&` only if ax-vault is unarchived and revived.
  export-summary:
    if: false && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      # No `ref:` pin here on purpose (see the 2026-09-28 incident below) -
      # plain checkout picks up whatever is on the default branch right now,
      # which by the time this job starts already includes the source
      # workflow's own data-update commit (workflow_run/completed fires only
      # after that whole run, including its final commit+push step, is done).
      #
      # 2026-09-28 incident: this used to pin
      # `ref: ${{ github.event.workflow_run.head_sha || github.sha }}`. That
      # head_sha is the commit the SOURCE workflow started FROM, not the one
      # it just pushed - update.yml's last step commits fresh data AFTER
      # that SHA is already fixed. Both export jobs kept checking out
      # yesterday's public/data.json and reported a false "success" (0 files
      # created, matching the previous day's count exactly) with no failure
      # signal. Fixed by dropping the pin; the "Show checked-out commit" and
      # "Fail if today's articles weren't exported" steps below exist so a
      # repeat of this (or anything else that ends up reading stale data)
      # fails loudly instead of silently.
      - name: Checkout korea-industry-ax
        uses: actions/checkout@v4

      - name: Show checked-out commit
        run: |
          echo "Checked out korea-industry-ax commit: $(git rev-parse HEAD)"
          git log -1 --format='  %H %cI %s'

      - name: Checkout AX vault
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.VAULT_REPO }}
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install trafilatura (full mode only)
        if: ${{ (vars.EXPORT_MODE || 'summary') == 'full' }}
        run: pip install trafilatura

      - name: Export published articles to vault
        id: export
        run: python scripts/export_to_vault.py --data public/data.json --vault-dir vault
        env:
          EXPORT_MODE: ${{ vars.EXPORT_MODE || 'summary' }}

      - name: Commit and push to vault
        working-directory: vault
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AX뉴스
          git diff --staged --quiet || git commit -m "AX 뉴스 export $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      # Guards against a repeat of the 2026-09-28 incident: if data.json's
      # newest article is dated today (KST - the same boundary the rest of
      # the pipeline uses, see jobs/timewindow.py) but this run created 0
      # files, something is wrong (stale checkout, a vault-side issue, etc.)
      # and the job should turn red instead of quietly reporting "success".
      # Known limitation: re-running this workflow a second time on a day
      # where everything from today was already exported by the first run
      # will also trip this (0 created is then correct, not a bug) - that's
      # an accepted trade-off for catching the silent-stale-data case.
      - name: Fail if today's articles weren't exported
        run: |
          today_kst=$(TZ=Asia/Seoul date +%Y-%m-%d)
          latest_date_kst=""
          if [ -n "$LATEST_PUBLISHED" ]; then
            latest_date_kst=$(TZ=Asia/Seoul date -d "$LATEST_PUBLISHED" +%Y-%m-%d 2>/dev/null || echo "")
          fi
          echo "Today (KST): $today_kst"
          echo "data.json latest published article: ${LATEST_PUBLISHED:-N/A} (date: ${latest_date_kst:-N/A})"
          echo "Created this run: ${CREATED:-0}"
          if [ "$latest_date_kst" = "$today_kst" ] && [ "${CREATED:-0}" = "0" ]; then
            echo "::error::data.json's most recent article is dated today ($today_kst KST) but this run created 0 files - export likely read stale data. Check the 'Show checked-out commit' step above."
            exit 1
          fi
        env:
          LATEST_PUBLISHED: ${{ steps.export.outputs.latest_published }}
          CREATED: ${{ steps.export.outputs.created }}

  # Private full-text vault (matrixshin-ai/ax-vault-full) - always EXPORT_MODE
  # full (trafilatura-extracted article body), independent of vars.EXPORT_MODE
  # above. Repo name is hardcoded here since this job is dedicated to this one
  # private vault, not parameterized like export-summary's vars.VAULT_REPO.
  export-full:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # See export-summary's checkout step above for why there is no `ref:` pin.
      - name: Checkout korea-industry-ax
        uses: actions/checkout@v4

      - name: Show checked-out commit
        run: |
          echo "Checked out korea-industry-ax commit: $(git rev-parse HEAD)"
          git log -1 --format='  %H %cI %s'

      - name: Checkout AX vault (full)
        uses: actions/checkout@v4
        with:
          repository: matrixshin-ai/ax-vault-full
          ssh-key: ${{ secrets.VAULT_FULL_DEPLOY_KEY }}
          path: vault-full

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install trafilatura
        run: pip install trafilatura

      - name: Export published articles to vault (full text)
        id: export
        run: python scripts/export_to_vault.py --data public/data.json --vault-dir vault-full
        env:
          EXPORT_MODE: full

      - name: Commit and push to vault (full)
        working-directory: vault-full
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AX뉴스
          git diff --staged --quiet || git commit -m "AX 뉴스 export (full) $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push

      # See export-summary's equivalent step above for the rationale and the
      # known same-day-rerun limitation.
      - name: Fail if today's articles weren't exported
        run: |
          today_kst=$(TZ=Asia/Seoul date +%Y-%m-%d)
          latest_date_kst=""
          if [ -n "$LATEST_PUBLISHED" ]; then
            latest_date_kst=$(TZ=Asia/Seoul date -d "$LATEST_PUBLISHED" +%Y-%m-%d 2>/dev/null || echo "")
          fi
          echo "Today (KST): $today_kst"
          echo "data.json latest published article: ${LATEST_PUBLISHED:-N/A} (date: ${latest_date_kst:-N/A})"
          echo "Created this run: ${CREATED:-0}"
          if [ "$latest_date_kst" = "$today_kst" ] && [ "${CREATED:-0}" = "0" ]; then
            echo "::error::data.json's most recent article is dated today ($today_kst KST) but this run created 0 files - export likely read stale data. Check the 'Show checked-out commit' step above."
            exit 1
          fi
        env:
          LATEST_PUBLISHED: ${{ steps.export.outputs.latest_published }}
          CREATED: ${{ steps.export.outputs.created }}
