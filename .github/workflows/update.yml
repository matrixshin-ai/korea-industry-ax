name: Update industry AX briefing

on:
  schedule:
    # 21:33 UTC = 06:33 KST next day, Mon-Sat (Sunday does not run).
    - cron: '33 21 * * 0-5'
  workflow_dispatch: {}

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fails the whole run immediately if a required secret is unset/empty,
      # instead of letting collect.py/classify.py/build.py silently degrade
      # (skip Naver, leave candidates unclassified, skip the llm_dedup merge
      # pass) with no failure signal - that silent-degradation path is
      # exactly how the "Build public/data.json" step ran two full days
      # without ANTHROPIC_API_KEY (added 2026-09-26 as a fix for the outage,
      # not a secret being unset) before anyone noticed. Reads secrets into
      # env vars rather than interpolating `${{ secrets.X }}` directly into
      # the script, per GitHub's guidance for referencing secrets in `run:`.
      - name: Verify required secrets are configured
        run: |
          missing=()
          [ -z "$NAVER_CLIENT_ID" ] && missing+=(NAVER_CLIENT_ID)
          [ -z "$NAVER_CLIENT_SECRET" ] && missing+=(NAVER_CLIENT_SECRET)
          [ -z "$ANTHROPIC_API_KEY" ] && missing+=(ANTHROPIC_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository secret(s): ${missing[*]} - set them in Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "All required secrets (NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, ANTHROPIC_API_KEY) are present."
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect RSS + Naver candidates
        run: python jobs/collect.py
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      # data/classify_cache.json is never committed (see .gitignore) - it's kept
      # across runs via actions/cache instead. Every run saves under a unique
      # run_id key; restore-keys falls back to the most recent previous key
      # prefix match, i.e. the latest cache. A cache miss (first-ever run, or
      # cache expired/evicted) is a normal cold start - classify.py works fine
      # with no cache file at all.
      - name: Restore classification cache
        uses: actions/cache@v4
        with:
          path: data/classify_cache.json
          key: classify-cache-${{ github.run_id }}
          restore-keys: |
            classify-cache-

      - name: Classify with Haiku
        run: python jobs/classify.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Needs the same key as the classify step: build.py's llm_dedup pass
      # (jobs/llm_dedup.py) also calls Haiku, to merge same-event duplicates
      # among the day's publishable (S/A) candidates. Without this, the pass
      # is silently skipped (build.py falls back to algorithmic dedup only -
      # see the "ANTHROPIC_API_KEY not set" print in its log) - found missing
      # here on 2026-09-26 (run #2), fixed same day.
      - name: Build public/data.json
        run: python jobs/build.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # A chunk that still fails after llm_dedup.py's halve-and-retry (see
      # jobs/llm_dedup.py) means some real duplicates for that chunk likely
      # weren't merged - stats.llm_dedup.llm_dedup_errors is the only record
      # of that, and nobody was checking it (2026-09-29 incident). Surfacing
      # it in the run summary makes it visible without having to know to
      # look inside data.json.
      - name: Warn if llm_dedup had unrecoverable chunk failures
        run: |
          python - <<'PYEOF'
          import json
          import os

          with open("public/data.json", encoding="utf-8") as f:
              data = json.load(f)
          errors = data.get("stats", {}).get("llm_dedup", {}).get("llm_dedup_errors") or []

          if not errors:
              print("llm_dedup: no unrecoverable chunk failures.")
          else:
              lines = [
                  f"### ⚠️ llm_dedup: {len(errors)}개 청크가 재시도 후에도 최종 실패",
                  "",
                  "해당 청크에 속한 기사들의 동일 사건 병합이 누락됐을 수 있습니다.",
                  "",
              ]
              for e in errors:
                  if isinstance(e, dict):
                      lines.append(f"- chunk_size={e.get('chunk_size')}: {e.get('error')}")
                  else:
                      lines.append(f"- {e}")
              summary = "\n".join(lines) + "\n"
              print(summary)
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as f:
                      f.write(summary)
          PYEOF

      - name: Trim old logs (keep most recent 14 - ~2 weeks of daily runs)
        run: |
          cd logs
          ls -1t run_*.json 2>/dev/null | tail -n +15 | xargs -r rm --
          ls -1t classify_*.json 2>/dev/null | tail -n +15 | xargs -r rm --
          ls -1t yield_*.json 2>/dev/null | tail -n +15 | xargs -r rm --

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json logs/
          git diff --staged --quiet || git commit -m "Data update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push origin main
