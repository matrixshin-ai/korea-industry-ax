# RSS feeds: press only, economy/industry/IT sections preferred over general feeds.
# No public-agency feeds (정책브리핑, 지자체, 대학, 진흥원, KOTRA, etc).
#
# Every URL below was actually fetched and parsed successfully (feedparser, entries > 0)
# during the Gate 1 verification pass on 2026-09-24 KST. Candidates that returned 404,
# an empty body, or no parseable feed were dropped rather than guessed - see the Gate 1
# report for the full pass/fail list (~35 candidates tested, 24 passed).
#
# Known caveats (kept anyway, Naver search backfills any gaps):
# - 한국경제: occasionally blocked by Cloudflare bot-challenge (intermittent, not fixed cause).
# - 이데일리: only a general "all articles" feed was found, not an economy-only one.
# - 헬로티: pubDate has no timezone offset; treated as UTC like every other naive timestamp
#   (see jobs/timewindow.py), which can shift its window boundary by ~9h either way.
# - 한겨레 RSS was found and parses, but has no pubDate/updated tag on any entry at all,
#   so every entry fails the 48h/72h window check and it would never contribute an article.
#   Excluded for that reason; Naver search still surfaces 한겨레 articles when relevant.
feeds:
  - url: "https://www.hankyung.com/feed/economy"
    source: "한국경제"
  - url: "https://www.asiae.co.kr/rss/industry-IT.htm"
    source: "아시아경제"
  - url: "https://rss.donga.com/economy.xml"
    source: "동아일보"
  - url: "https://www.khan.co.kr/rss/rssdata/economy_news.xml"
    source: "경향신문"
  - url: "https://www.kmib.co.kr/rss/data/kmibEcoRss.xml"
    source: "국민일보"
  - url: "https://www.mbn.co.kr/rss/economy/"
    source: "MBN"
  - url: "https://www.yna.co.kr/rss/economy.xml"
    source: "연합뉴스"
  - url: "https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml"
    source: "조선일보"
  - url: "https://www.seoul.co.kr/xml/rss/google_economy.xml"
    source: "서울신문"
  - url: "https://www.segye.com/Articles/RSSList/segye_economy.xml"
    source: "세계일보"

  # 울산
  - url: "https://www.iusm.co.kr/rss/allArticle.xml"
    source: "울산매일"
  - url: "https://www.ulsanpress.net/rss/allArticle.xml"
    source: "울산신문"
  - url: "https://www.ksilbo.co.kr/rss/allArticle.xml"
    source: "경상일보"
  - url: "http://www.ujeil.com/rss/allArticle.xml"
    source: "울산제일일보"

  # 통신사 - 산업·IT 섹션만
  - url: "https://www.newsis.com/RSS/industry.xml"
    source: "뉴시스"
  - url: "https://www.newsis.com/RSS/health.xml"
    source: "뉴시스"

  # 경제지
  - url: "https://www.sedaily.com/rss/economy"
